name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  r-syntax:
    name: Parse R scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Check that every R script parses
        run: Rscript -e 'for (f in list.files("R", pattern = "[.]R$", full.names = TRUE)) invisible(parse(f))'

  latex:
    name: Build report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          working_directory: report
      - uses: actions/upload-artifact@v4
        with:
          name: report-pdf
          path: report/main.pdf
